services:
  mariadb:
    image: mariadb:11.4
    container_name: nineboamp-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: nineboamp
      MYSQL_USER: nineboamp
      MYSQL_PASSWORD: changeme
    volumes:
      - ./volume/mariadb:/var/lib/mysql
    healthcheck:
      # Le fichier .my-healthcheck.cnf est ignoré par mysql s'il est world-writable :
      # on corrige les permissions avant de tester (volume bind existant).
      test: ["CMD-SHELL", "chmod 600 /var/lib/mysql/.my-healthcheck.cnf && healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  nineboamp:
    build:
      context: .
      dockerfile: ./misc/docker/Dockerfile
    container_name: nineboamp
    restart: unless-stopped
    image: reg.cadoles.com/envole/nineboamp
    # L'entrypoint démarre en root pour aligner ./var sur le propriétaire du code
    # monté, puis abandonne les privilèges (UID hôte, GID 101 = apache) : httpd
    # garde l'écriture dans /var/log/apache2 et le crontab dans var/log/cron.log.
    user: "0:0"
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8024:80"
    volumes:
      - ./public/uploads:/app/public/uploads:delegated
      - ./uploads:/app/uploads:delegated
      - ./templates:/app/templates:delegated
      - ./config:/app/config:delegated
      - ./src:/app/src:delegated
      - ./misc:/app/misc:delegated
      - ./public/lib:/app/public/lib:delegated
      - ./var:/app/var
      - ./.env.local:/app/.env.local
      - ./.env:/app/.env
