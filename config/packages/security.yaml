security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

  # Hiérarchie explicite : ADMIN hérite MASTER hérite USER
  role_hierarchy:
    ROLE_ADMIN: ROLE_MASTER
    ROLE_MASTER: ROLE_USER

  providers:
    sql_provider:
      entity:
        class: App\Entity\User
        property: username
    mcp_provider:
      id: App\Security\McpSystemUserProvider


  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    mcp:
      pattern: ^/(mcp|api)
      security: true
      stateless: true
      provider: mcp_provider
      custom_authenticators:
        - App\Security\McpAuthenticator

    main:
      pattern: ^/
      provider: sql_provider
      entry_point: App\Security\AuthGuardEntryPoint
      custom_authenticators:
        - App\Security\CasAuthenticator
        - App\Security\OidcAuthenticator
      form_login:
        login_path: app_login
        check_path: app_login
        enable_csrf: true
        csrf_token_id: authenticate
        csrf_parameter: _csrf_token
        default_target_path: /
      logout:
        path: app_logout

  access_control:
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/admin, roles: ROLE_ADMIN }
    - { path: ^/master, roles: ROLE_MASTER }
    # PUBLIC_ACCESS ici n'est pas une faille : la protection est portée
    # par McpAuthenticator (Bearer obligatoire) => 401 plutôt que 403.
    # /mcp est machine-to-machine : un client API ne sait pas suivre
    # un flow de login interactif (CAS/OIDC).
    - { path: ^/mcp, roles: PUBLIC_ACCESS }
    - { path: ^/user, roles: ROLE_USER }
    - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4 # Lowest possible value for bcrypt
        time_cost: 3 # Lowest possible value for argon
        memory_cost: 10 # Lowest possible value for argon
